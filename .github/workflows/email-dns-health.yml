name: Email & DNS Health CI
on:
  schedule:
    # Run daily at 04:30 UTC (10:00 AM IST) - 30m before SEO Health CI
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  dns-health:
    name: "Audit: SPF, DKIM, DMARC, MX"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python & uv
        uses: astral-sh/setup-uv@v5

      - name: Run Email Deliverability & DNS Verification
        run: |
          uv run python scripts/verify_email_dns.py

      - name: Manage DNS Incident Issues
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          uv run python scripts/manage_dns_issues.py "${{ github.repository }}"

      - name: Commit DNS Reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dns/
          if git diff --staged --quiet; then
            echo "No DNS changes to commit"
          else
            git commit -m "📬 Update Email Deliverability & DNS Health Report [$(date -u +%Y-%m-%d)]"
            git pull --rebase
            git push
          fi
