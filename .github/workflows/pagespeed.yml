name: PageSpeed Insights CI
on:
  schedule:
    # Run daily at 06:00 UTC (11:30 AM IST)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  pagespeed:
    name: "PSI: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DrSumaiya.com
            url: https://drsumaiya.com/
            slug: dr-sumaiya-com
          - name: IQS
            url: https://iqs.org.in/
            slug: iqs

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Run PageSpeed Insights / Lighthouse (Mobile)
        id: psi_mobile
        run: |
          URL="${{ matrix.url }}"
          API_KEY="${{ secrets.PAGESPEED_API_KEY }}"
          SUCCESS=false

          if [ -n "$API_KEY" ]; then
            echo "Attempting PageSpeed Insights API with key..."
            ENCODED_URL=$(jq -rn --arg u "$URL" '$u|@uri')
            RESPONSE=$(curl -s "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${ENCODED_URL}&category=PERFORMANCE&category=ACCESSIBILITY&category=BEST_PRACTICES&category=SEO&strategy=MOBILE&key=${API_KEY}")
            if echo "$RESPONSE" | jq -e '.lighthouseResult.categories' > /dev/null 2>&1; then
              echo "$RESPONSE" | jq '.lighthouseResult' > /tmp/psi_mobile.json
              SUCCESS=true
            else
              echo "PageSpeed API returned an error or quota limit. Falling back to runner Lighthouse CLI."
            fi
          fi

          if [ "$SUCCESS" = false ]; then
            echo "Running Lighthouse CLI (Mobile) via Chrome headless..."
            MOBILE_UA="Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36"
            WAF_TOKEN="${{ secrets.UPPTIME_WAF_SECRET }}"
            if [ -n "$WAF_TOKEN" ]; then
              EXTRA_HEADERS="{\"X-Upptime-Token\":\"${WAF_TOKEN}\",\"Accept-Language\":\"en-US,en;q=0.9\"}"
            else
              EXTRA_HEADERS='{"Accept-Language":"en-US,en;q=0.9"}'
            fi
            CHROME_FLAGS="--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-blink-features=AutomationControlled --user-agent=\"${MOBILE_UA}\""

            npx lighthouse "$URL" \
              --output=json \
              --output-path=/tmp/psi_mobile.json \
              --only-categories=performance,accessibility,best-practices,seo \
              --form-factor=mobile \
              --screenEmulation.mobile \
              --throttling-method=simulate \
              --extra-headers="${EXTRA_HEADERS}" \
              --chrome-flags="${CHROME_FLAGS}" || true

            # If attempt 1 returned invalid or empty categories, wait 5s and retry once
            if [ ! -f /tmp/psi_mobile.json ] || ! jq -e '.categories.performance' /tmp/psi_mobile.json > /dev/null 2>&1; then
              echo "Lighthouse Mobile attempt 1 failed or returned empty categories. Retrying in 5 seconds..."
              sleep 5
              npx lighthouse "$URL" \
                --output=json \
                --output-path=/tmp/psi_mobile.json \
                --only-categories=performance,accessibility,best-practices,seo \
                --form-factor=mobile \
                --screenEmulation.mobile \
                --throttling-method=simulate \
                --extra-headers="${EXTRA_HEADERS}" \
                --chrome-flags="${CHROME_FLAGS}" || true
            fi
          fi

          if [ ! -f /tmp/psi_mobile.json ] || ! jq -e '.categories' /tmp/psi_mobile.json > /dev/null 2>&1; then
            echo "Warning: Valid Lighthouse report not generated for Mobile."
            echo '{"categories": {}, "audits": {}}' > /tmp/psi_mobile.json
          fi

          DATA=$(cat /tmp/psi_mobile.json)
          PERF=$(echo "$DATA" | jq '((.categories.performance.score // 0) * 100) | round')
          A11Y=$(echo "$DATA" | jq '((.categories.accessibility.score // 0) * 100) | round')
          BP=$(echo "$DATA" | jq '((.categories["best-practices"].score // 0) * 100) | round')
          SEO=$(echo "$DATA" | jq '((.categories.seo.score // 0) * 100) | round')

          FCP=$(echo "$DATA" | jq -r '.audits["first-contentful-paint"].displayValue // "N/A"')
          LCP=$(echo "$DATA" | jq -r '.audits["largest-contentful-paint"].displayValue // "N/A"')
          TBT=$(echo "$DATA" | jq -r '.audits["total-blocking-time"].displayValue // "N/A"')
          CLS=$(echo "$DATA" | jq -r '.audits["cumulative-layout-shift"].displayValue // "N/A"')
          SI=$(echo "$DATA" | jq -r '.audits["speed-index"].displayValue // "N/A"')

          LCP_MS=$(echo "$DATA" | jq '(.audits["largest-contentful-paint"].numericValue // 0) | round')
          CLS_X1000=$(echo "$DATA" | jq '((.audits["cumulative-layout-shift"].numericValue // 0) * 1000) | round')

          echo "perf=$PERF" >> "$GITHUB_OUTPUT"
          echo "a11y=$A11Y" >> "$GITHUB_OUTPUT"
          echo "bp=$BP" >> "$GITHUB_OUTPUT"
          echo "seo=$SEO" >> "$GITHUB_OUTPUT"
          echo "fcp=$FCP" >> "$GITHUB_OUTPUT"
          echo "lcp=$LCP" >> "$GITHUB_OUTPUT"
          echo "tbt=$TBT" >> "$GITHUB_OUTPUT"
          echo "cls=$CLS" >> "$GITHUB_OUTPUT"
          echo "si=$SI" >> "$GITHUB_OUTPUT"
          echo "lcp_ms=$LCP_MS" >> "$GITHUB_OUTPUT"
          echo "cls_x1000=$CLS_X1000" >> "$GITHUB_OUTPUT"

      - name: Run PageSpeed Insights / Lighthouse (Desktop)
        id: psi_desktop
        run: |
          URL="${{ matrix.url }}"
          API_KEY="${{ secrets.PAGESPEED_API_KEY }}"
          SUCCESS=false

          if [ -n "$API_KEY" ]; then
            echo "Attempting PageSpeed Insights API with key..."
            ENCODED_URL=$(jq -rn --arg u "$URL" '$u|@uri')
            RESPONSE=$(curl -s "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${ENCODED_URL}&category=PERFORMANCE&category=ACCESSIBILITY&category=BEST_PRACTICES&category=SEO&strategy=DESKTOP&key=${API_KEY}")
            if echo "$RESPONSE" | jq -e '.lighthouseResult.categories' > /dev/null 2>&1; then
              echo "$RESPONSE" | jq '.lighthouseResult' > /tmp/psi_desktop.json
              SUCCESS=true
            else
              echo "PageSpeed API returned an error or quota limit. Falling back to runner Lighthouse CLI."
            fi
          fi

          if [ "$SUCCESS" = false ]; then
            echo "Running Lighthouse CLI (Desktop) via Chrome headless..."
            DESKTOP_UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
            WAF_TOKEN="${{ secrets.UPPTIME_WAF_SECRET }}"
            if [ -n "$WAF_TOKEN" ]; then
              EXTRA_HEADERS="{\"X-Upptime-Token\":\"${WAF_TOKEN}\",\"Accept-Language\":\"en-US,en;q=0.9\"}"
            else
              EXTRA_HEADERS='{"Accept-Language":"en-US,en;q=0.9"}'
            fi
            CHROME_FLAGS="--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-blink-features=AutomationControlled --user-agent=\"${DESKTOP_UA}\""

            npx lighthouse "$URL" \
              --output=json \
              --output-path=/tmp/psi_desktop.json \
              --only-categories=performance,accessibility,best-practices,seo \
              --preset=desktop \
              --extra-headers="${EXTRA_HEADERS}" \
              --chrome-flags="${CHROME_FLAGS}" || true

            # If attempt 1 returned invalid or empty categories, wait 5s and retry once
            if [ ! -f /tmp/psi_desktop.json ] || ! jq -e '.categories.performance' /tmp/psi_desktop.json > /dev/null 2>&1; then
              echo "Lighthouse Desktop attempt 1 failed or returned empty categories. Retrying in 5 seconds..."
              sleep 5
              npx lighthouse "$URL" \
                --output=json \
                --output-path=/tmp/psi_desktop.json \
                --only-categories=performance,accessibility,best-practices,seo \
                --preset=desktop \
                --extra-headers="${EXTRA_HEADERS}" \
                --chrome-flags="${CHROME_FLAGS}" || true
            fi
          fi

          if [ ! -f /tmp/psi_desktop.json ] || ! jq -e '.categories' /tmp/psi_desktop.json > /dev/null 2>&1; then
            echo "Warning: Valid Lighthouse report not generated for Desktop."
            echo '{"categories": {}, "audits": {}}' > /tmp/psi_desktop.json
          fi

          DATA=$(cat /tmp/psi_desktop.json)
          PERF=$(echo "$DATA" | jq '((.categories.performance.score // 0) * 100) | round')
          A11Y=$(echo "$DATA" | jq '((.categories.accessibility.score // 0) * 100) | round')
          BP=$(echo "$DATA" | jq '((.categories["best-practices"].score // 0) * 100) | round')
          SEO=$(echo "$DATA" | jq '((.categories.seo.score // 0) * 100) | round')

          FCP=$(echo "$DATA" | jq -r '.audits["first-contentful-paint"].displayValue // "N/A"')
          LCP=$(echo "$DATA" | jq -r '.audits["largest-contentful-paint"].displayValue // "N/A"')
          TBT=$(echo "$DATA" | jq -r '.audits["total-blocking-time"].displayValue // "N/A"')
          CLS=$(echo "$DATA" | jq -r '.audits["cumulative-layout-shift"].displayValue // "N/A"')
          SI=$(echo "$DATA" | jq -r '.audits["speed-index"].displayValue // "N/A"')

          LCP_MS=$(echo "$DATA" | jq '(.audits["largest-contentful-paint"].numericValue // 0) | round')
          CLS_X1000=$(echo "$DATA" | jq '((.audits["cumulative-layout-shift"].numericValue // 0) * 1000) | round')

          echo "perf=$PERF" >> "$GITHUB_OUTPUT"
          echo "a11y=$A11Y" >> "$GITHUB_OUTPUT"
          echo "bp=$BP" >> "$GITHUB_OUTPUT"
          echo "seo=$SEO" >> "$GITHUB_OUTPUT"
          echo "fcp=$FCP" >> "$GITHUB_OUTPUT"
          echo "lcp=$LCP" >> "$GITHUB_OUTPUT"
          echo "tbt=$TBT" >> "$GITHUB_OUTPUT"
          echo "cls=$CLS" >> "$GITHUB_OUTPUT"
          echo "si=$SI" >> "$GITHUB_OUTPUT"
          echo "lcp_ms=$LCP_MS" >> "$GITHUB_OUTPUT"
          echo "cls_x1000=$CLS_X1000" >> "$GITHUB_OUTPUT"

      - name: Save results
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DATE=$(date -u +"%Y-%m-%d")
          SLUG="${{ matrix.slug }}"

          mkdir -p "pagespeed/${SLUG}/raw"
          mkdir -p pagespeed/history

          M_PERF=${{ steps.psi_mobile.outputs.perf }}
          M_A11Y=${{ steps.psi_mobile.outputs.a11y }}
          D_PERF=${{ steps.psi_desktop.outputs.perf }}
          D_A11Y=${{ steps.psi_desktop.outputs.a11y }}

          # Check if the audit produced valid categories
          IS_VALID=true
          if [ "$M_PERF" -eq 0 ] && [ "$M_A11Y" -eq 0 ] && [ "$D_PERF" -eq 0 ] && [ "$D_A11Y" -eq 0 ]; then
            IS_VALID=false
            echo "::warning::Audit for ${{ matrix.name }} produced 0 scores across all categories."
          fi

          NEW_DATA=$(cat << EOF
          {
            "name": "${{ matrix.name }}",
            "url": "${{ matrix.url }}",
            "timestamp": "$TIMESTAMP",
            "auditStatus": "$([ "$IS_VALID" = true ] && echo "success" || echo "failed")",
            "mobile": {
              "performance": ${{ steps.psi_mobile.outputs.perf }},
              "accessibility": ${{ steps.psi_mobile.outputs.a11y }},
              "bestPractices": ${{ steps.psi_mobile.outputs.bp }},
              "seo": ${{ steps.psi_mobile.outputs.seo }},
              "coreWebVitals": {
                "firstContentfulPaint": "${{ steps.psi_mobile.outputs.fcp }}",
                "largestContentfulPaint": "${{ steps.psi_mobile.outputs.lcp }}",
                "totalBlockingTime": "${{ steps.psi_mobile.outputs.tbt }}",
                "cumulativeLayoutShift": "${{ steps.psi_mobile.outputs.cls }}",
                "speedIndex": "${{ steps.psi_mobile.outputs.si }}"
              }
            },
            "desktop": {
              "performance": ${{ steps.psi_desktop.outputs.perf }},
              "accessibility": ${{ steps.psi_desktop.outputs.a11y }},
              "bestPractices": ${{ steps.psi_desktop.outputs.bp }},
              "seo": ${{ steps.psi_desktop.outputs.seo }},
              "coreWebVitals": {
                "firstContentfulPaint": "${{ steps.psi_desktop.outputs.fcp }}",
                "largestContentfulPaint": "${{ steps.psi_desktop.outputs.lcp }}",
                "totalBlockingTime": "${{ steps.psi_desktop.outputs.tbt }}",
                "cumulativeLayoutShift": "${{ steps.psi_desktop.outputs.cls }}",
                "speedIndex": "${{ steps.psi_desktop.outputs.si }}"
              }
            }
          }
          EOF
          )

          # Only overwrite latest.json if this audit is valid OR no valid prior latest.json exists
          if [ "$IS_VALID" = true ] || [ ! -f "pagespeed/${SLUG}/latest.json" ]; then
            echo "$NEW_DATA" > "pagespeed/${SLUG}/latest.json"
          elif [ -f "pagespeed/${SLUG}/latest.json" ] && jq -e '(.mobile.performance // 0) > 0 or (.desktop.performance // 0) > 0' "pagespeed/${SLUG}/latest.json" > /dev/null 2>&1; then
            echo "Preserving prior valid latest.json to prevent corrupting status dashboard."
          else
            echo "$NEW_DATA" > "pagespeed/${SLUG}/latest.json"
          fi

          # Only append to history if valid (never pollute time series with 0-score failed runs)
          if [ "$IS_VALID" = true ]; then
            HISTORY_LINE=$(echo "$NEW_DATA" | jq -c '.')
            echo "$HISTORY_LINE" >> "pagespeed/history/${SLUG}.jsonl"
          else
            echo "Skipping history append for failed audit."
          fi

          # Save full responses for detailed analysis
          cp /tmp/psi_mobile.json "pagespeed/${SLUG}/raw/mobile-${DATE}.json"
          cp /tmp/psi_desktop.json "pagespeed/${SLUG}/raw/desktop-${DATE}.json"

      - name: Generate site summary
        run: |
          SLUG="${{ matrix.slug }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          M_PERF=${{ steps.psi_mobile.outputs.perf }}
          M_A11Y=${{ steps.psi_mobile.outputs.a11y }}
          D_PERF=${{ steps.psi_desktop.outputs.perf }}
          D_A11Y=${{ steps.psi_desktop.outputs.a11y }}

          if [ "$M_PERF" -eq 0 ] && [ "$M_A11Y" -eq 0 ] && [ "$D_PERF" -eq 0 ] && [ "$D_A11Y" -eq 0 ] && [ -f "pagespeed/${SLUG}/summary.md" ]; then
            echo "Audit failed; keeping previous summary.md if it had valid scores."
          else
            cat > "pagespeed/${SLUG}/summary.md" << EOF
          ## ${{ matrix.name }} — [\`${{ matrix.url }}\`](${{ matrix.url }})

          > Last updated: \`${TIMESTAMP}\`

          ### 📱 Mobile

          | Category | Score |
          | --- | --- |
          | Performance | ${{ steps.psi_mobile.outputs.perf }} |
          | Accessibility | ${{ steps.psi_mobile.outputs.a11y }} |
          | Best Practices | ${{ steps.psi_mobile.outputs.bp }} |
          | SEO | ${{ steps.psi_mobile.outputs.seo }} |

          **Core Web Vitals (Mobile)**
          | Metric | Value |
          | --- | --- |
          | First Contentful Paint | ${{ steps.psi_mobile.outputs.fcp }} |
          | Largest Contentful Paint | ${{ steps.psi_mobile.outputs.lcp }} |
          | Total Blocking Time | ${{ steps.psi_mobile.outputs.tbt }} |
          | Cumulative Layout Shift | ${{ steps.psi_mobile.outputs.cls }} |
          | Speed Index | ${{ steps.psi_mobile.outputs.si }} |

          ### 🖥️ Desktop

          | Category | Score |
          | --- | --- |
          | Performance | ${{ steps.psi_desktop.outputs.perf }} |
          | Accessibility | ${{ steps.psi_desktop.outputs.a11y }} |
          | Best Practices | ${{ steps.psi_desktop.outputs.bp }} |
          | SEO | ${{ steps.psi_desktop.outputs.seo }} |

          **Core Web Vitals (Desktop)**
          | Metric | Value |
          | --- | --- |
          | First Contentful Paint | ${{ steps.psi_desktop.outputs.fcp }} |
          | Largest Contentful Paint | ${{ steps.psi_desktop.outputs.lcp }} |
          | Total Blocking Time | ${{ steps.psi_desktop.outputs.tbt }} |
          | Cumulative Layout Shift | ${{ steps.psi_desktop.outputs.cls }} |
          | Speed Index | ${{ steps.psi_desktop.outputs.si }} |

          ---
          EOF
          fi

      - name: Manage Performance Incident Issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          SLUG="${{ matrix.slug }}"
          NAME="${{ matrix.name }}"
          URL="${{ matrix.url }}"
          M_PERF="${{ steps.psi_mobile.outputs.perf }}"
          D_PERF="${{ steps.psi_desktop.outputs.perf }}"
          M_LCP="${{ steps.psi_mobile.outputs.lcp }}"
          D_LCP="${{ steps.psi_desktop.outputs.lcp }}"
          M_CLS="${{ steps.psi_mobile.outputs.cls }}"
          D_CLS="${{ steps.psi_desktop.outputs.cls }}"
          M_FCP="${{ steps.psi_mobile.outputs.fcp }}"
          D_FCP="${{ steps.psi_desktop.outputs.fcp }}"
          M_TBT="${{ steps.psi_mobile.outputs.tbt }}"
          D_TBT="${{ steps.psi_desktop.outputs.tbt }}"

          M_LCP_MS="${{ steps.psi_mobile.outputs.lcp_ms }}"
          M_CLS_X1000="${{ steps.psi_mobile.outputs.cls_x1000 }}"
          D_LCP_MS="${{ steps.psi_desktop.outputs.lcp_ms }}"
          D_CLS_X1000="${{ steps.psi_desktop.outputs.cls_x1000 }}"

          M_PERF="${M_PERF:-0}"
          D_PERF="${D_PERF:-0}"
          M_LCP_MS="${M_LCP_MS:-0}"
          M_CLS_X1000="${M_CLS_X1000:-0}"
          D_LCP_MS="${D_LCP_MS:-0}"
          D_CLS_X1000="${D_CLS_X1000:-0}"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Budget Thresholds
          PERF_THRESHOLD=60
          LCP_BUDGET_MS=4000     # 4.0s (Google Poor threshold)
          CLS_BUDGET_X1000=250   # 0.25 (Google Poor threshold)

          IS_DEGRADED=false
          VIOLATIONS_LIST=""
          VIOLATIONS_SUMMARY=""

          # 1. Performance Score Check (< 60)
          if [ "$M_PERF" -lt "$PERF_THRESHOLD" ]; then
            IS_DEGRADED=true
            VIOLATIONS_LIST="${VIOLATIONS_LIST}* ❌ **Mobile Performance Score**: \`${M_PERF}/100\` *(Budget: ≥ ${PERF_THRESHOLD}/100)*"$'\n'
            VIOLATIONS_SUMMARY="${VIOLATIONS_SUMMARY}Mobile Score (${M_PERF} < ${PERF_THRESHOLD}), "
          fi
          if [ "$D_PERF" -lt "$PERF_THRESHOLD" ]; then
            IS_DEGRADED=true
            VIOLATIONS_LIST="${VIOLATIONS_LIST}* ❌ **Desktop Performance Score**: \`${D_PERF}/100\` *(Budget: ≥ ${PERF_THRESHOLD}/100)*"$'\n'
            VIOLATIONS_SUMMARY="${VIOLATIONS_SUMMARY}Desktop Score (${D_PERF} < ${PERF_THRESHOLD}), "
          fi

          # 2. Core Web Vitals LCP Check (> 4.0s)
          if [ "$M_LCP_MS" -gt "$LCP_BUDGET_MS" ]; then
            IS_DEGRADED=true
            VIOLATIONS_LIST="${VIOLATIONS_LIST}* ❌ **Mobile Largest Contentful Paint (LCP)**: \`${M_LCP}\` *(Budget: ≤ 4.0s)*"$'\n'
            VIOLATIONS_SUMMARY="${VIOLATIONS_SUMMARY}Mobile LCP (${M_LCP} > 4.0s), "
          fi

          # 3. Core Web Vitals CLS Check (> 0.25)
          if [ "$M_CLS_X1000" -gt "$CLS_BUDGET_X1000" ]; then
            IS_DEGRADED=true
            VIOLATIONS_LIST="${VIOLATIONS_LIST}* ❌ **Mobile Cumulative Layout Shift (CLS)**: \`${M_CLS}\` *(Budget: ≤ 0.25)*"$'\n'
            VIOLATIONS_SUMMARY="${VIOLATIONS_SUMMARY}Mobile CLS (${M_CLS} > 0.25), "
          fi

          # 4. Complete Audit Failure Guard
          if [ "$M_PERF" -eq 0 ] && [ "$D_PERF" -eq 0 ]; then
            IS_DEGRADED=true
            VIOLATIONS_LIST="${VIOLATIONS_LIST}* ❌ **Audit Failure**: Unable to complete Lighthouse audit."$'\n'
            VIOLATIONS_SUMMARY="${VIOLATIONS_SUMMARY}Audit Failure, "
          fi

          # Strip trailing comma
          VIOLATIONS_SUMMARY="${VIOLATIONS_SUMMARY%, }"

          # Metric status labels for breakdown table
          [ "$M_PERF" -lt "$PERF_THRESHOLD" ] && M_STATUS="❌ Below ${PERF_THRESHOLD}" || M_STATUS="✅ OK"
          [ "$D_PERF" -lt "$PERF_THRESHOLD" ] && D_STATUS="❌ Below ${PERF_THRESHOLD}" || D_STATUS="✅ OK"

          if [ "$M_LCP_MS" -gt 4000 ]; then
            M_LCP_STATUS="❌ Poor (> 4.0s)"
          elif [ "$M_LCP_MS" -gt 2500 ]; then
            M_LCP_STATUS="⚠️ Needs Work (> 2.5s)"
          else
            M_LCP_STATUS="✅ Good (≤ 2.5s)"
          fi

          if [ "$M_CLS_X1000" -gt 250 ]; then
            M_CLS_STATUS="❌ Poor (> 0.25)"
          elif [ "$M_CLS_X1000" -gt 100 ]; then
            M_CLS_STATUS="⚠️ Needs Work (> 0.10)"
          else
            M_CLS_STATUS="✅ Good (≤ 0.10)"
          fi

          # Search for existing open performance issue for this site
          EXISTING_ISSUE=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label "performance-degradation" \
            --label "$SLUG" \
            --json number \
            --jq '.[0].number' 2>/dev/null || true)

          if [ "$IS_DEGRADED" = true ]; then
            TITLE="⚡ Performance / CWV Alert: ${NAME} (Score: ${M_PERF}/100, LCP: ${M_LCP}, CLS: ${M_CLS})"

            LABELS="performance-degradation,incident,$SLUG"
            if [ "$M_LCP_MS" -gt "$LCP_BUDGET_MS" ] || [ "$M_CLS_X1000" -gt "$CLS_BUDGET_X1000" ]; then
              LABELS="${LABELS},cwv-budget-exceeded"
            fi

            cat > /tmp/issue_body.md << EOF
          ### ⚠️ Performance & Core Web Vitals Budget Alert for [${NAME}](${URL})

          An automated Google PageSpeed Insights audit detected metric violations against target budgets:

          #### 🚨 Active Budget Violations:
          ${VIOLATIONS_LIST}

          #### 📊 Core Web Vitals & Performance Breakdown:
          | Metric | Mobile | Desktop | Budget Target | Status |
          | :--- | :---: | :---: | :---: | :---: |
          | **Performance Score** | **${M_PERF}/100** | **${D_PERF}/100** | ≥ ${PERF_THRESHOLD}/100 | ${M_STATUS} |
          | **Largest Contentful Paint (LCP)** | **${M_LCP}** | **${D_LCP}** | ≤ 2.5s (Good) / ≤ 4.0s (Budget) | ${M_LCP_STATUS} |
          | **Cumulative Layout Shift (CLS)** | **${M_CLS}** | **${D_CLS}** | ≤ 0.10 (Good) / ≤ 0.25 (Budget) | ${M_CLS_STATUS} |
          | First Contentful Paint (FCP) | \`${M_FCP}\` | \`${D_FCP}\` | ≤ 1.8s (Good) | - |
          | Total Blocking Time (TBT) | \`${M_TBT}\` | \`${D_TBT}\` | ≤ 200ms (Good) | - |
          | Speed Index | \`${{ steps.psi_mobile.outputs.si }}\` | \`${{ steps.psi_desktop.outputs.si }}\` | - | - |

          #### Additional Lighthouse Categories:
          * **Accessibility**: Mobile \`${{ steps.psi_mobile.outputs.a11y }}/100\` | Desktop \`${{ steps.psi_desktop.outputs.a11y }}/100\`
          * **Best Practices**: Mobile \`${{ steps.psi_mobile.outputs.bp }}/100\` | Desktop \`${{ steps.psi_desktop.outputs.bp }}/100\`
          * **SEO**: Mobile \`${{ steps.psi_mobile.outputs.seo }}/100\` | Desktop \`${{ steps.psi_desktop.outputs.seo }}/100\`

          [🔍 Run Live PageSpeed Analysis](https://pagespeed.web.dev/analysis?url=$(jq -rn --arg u "$URL" '$u|@uri'))

          ---
          *Reported at \`${TIMESTAMP}\` by PageSpeed CI. This issue will automatically be resolved and closed once scores recover to ≥ ${PERF_THRESHOLD}/100, LCP ≤ 4.0s, and CLS ≤ 0.25.*
          EOF

            if [ -n "$EXISTING_ISSUE" ] && [ "$EXISTING_ISSUE" != "null" ]; then
              echo "Updating existing open performance issue #${EXISTING_ISSUE}..."
              cat > /tmp/issue_comment.md << EOF
          **Daily Audit Update (\`${TIMESTAMP}\`):**
          - **Performance Score**: Mobile **${M_PERF}/100** (${M_STATUS}) | Desktop **${D_PERF}/100** (${D_STATUS})
          - **Largest Contentful Paint (LCP)**: **${M_LCP}** (${M_LCP_STATUS})
          - **Cumulative Layout Shift (CLS)**: **${M_CLS}** (${M_CLS_STATUS})
          - **Active Violations**: ${VIOLATIONS_SUMMARY}
          - **Current Status**: **Metrics remain outside budget. Issue remains open.**
          EOF
              gh issue comment "$EXISTING_ISSUE" --repo "${{ github.repository }}" --body-file /tmp/issue_comment.md || true
            else
              echo "Opening new performance / CWV issue for ${NAME}..."
              gh issue create \
                --repo "${{ github.repository }}" \
                --title "$TITLE" \
                --body-file /tmp/issue_body.md \
                --label "$LABELS" || true
            fi
          else
            echo "All Performance & Core Web Vitals metrics are healthy (Score: ${M_PERF}/100, LCP: ${M_LCP}, CLS: ${M_CLS})."
            if [ -n "$EXISTING_ISSUE" ] && [ "$EXISTING_ISSUE" != "null" ]; then
              echo "Resolving and closing performance issue #${EXISTING_ISSUE}..."
              cat > /tmp/resolve_comment.md << EOF
          **✅ Resolved:** Performance & Core Web Vitals for [${NAME}](${URL}) have fully recovered within target budgets!

          - **Mobile Performance**: **${M_PERF}/100** (Budget: ≥ ${PERF_THRESHOLD})
          - **Desktop Performance**: **${D_PERF}/100** (Budget: ≥ ${PERF_THRESHOLD})
          - **Largest Contentful Paint (LCP)**: **\`${M_LCP}\`** (Budget: ≤ 4.0s)
          - **Cumulative Layout Shift (CLS)**: **\`${M_CLS}\`** (Budget: ≤ 0.25)

          *Closed automatically by PageSpeed CI at \`${TIMESTAMP}\`.*
          EOF
              gh issue close "$EXISTING_ISSUE" --repo "${{ github.repository }}" --comment "$(cat /tmp/resolve_comment.md)" || true
            fi
          fi

      - name: Upload site artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pagespeed-${{ matrix.slug }}
          path: |
            pagespeed/${{ matrix.slug }}/
            pagespeed/history/${{ matrix.slug }}.jsonl

  # Collect all site summaries into a single README and commit once
  collect:
    name: Generate combined README & Commit
    runs-on: ubuntu-latest
    needs: pagespeed

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Pull latest changes
        run: git pull --rebase

      - name: Download all site artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pagespeed-*
          merge-multiple: true
          path: pagespeed

      - name: Build README
        run: |
          cat > pagespeed/README.md << 'HEADER'
          # PageSpeed Insights Results

          Automated daily performance tracking via [Google PageSpeed Insights / Lighthouse](https://pagespeed.web.dev/).

          HEADER

          # Concatenate all site summaries in alphabetical order
          for summary in pagespeed/*/summary.md; do
            if [ -f "$summary" ]; then
              cat "$summary" >> pagespeed/README.md
              echo "" >> pagespeed/README.md
            fi
          done

          cat >> pagespeed/README.md << 'FOOTER'

          *Powered by GitHub Actions + Lighthouse / PageSpeed Insights*
          FOOTER

      - name: Commit all results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pagespeed/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Update PageSpeed Insights results & summary [$(date -u +%Y-%m-%d)]"
            git pull --rebase
            git push
          fi
