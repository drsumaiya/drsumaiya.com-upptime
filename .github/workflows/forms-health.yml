name: Lead Intake & Form Health CI
on:
  schedule:
    # Run every 2 hours to rapidly detect broken forms, expired nonces, or plugin regressions
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  forms-health:
    name: "Synthetic Health Probe: Booking & Intake Forms"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python & uv
        uses: astral-sh/setup-uv@v5

      - name: Run Synthetic Form & Asset Probes
        run: |
          uv run python scripts/verify_forms_health.py

      - name: Manage Form Incident Issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          uv run python scripts/manage_form_issues.py "${{ github.repository }}"

      - name: Add Step Summary
        if: always()
        run: |
          if [ -f forms/summary.md ]; then
            cat forms/summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit Form Health Telemetry
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forms/
          if git diff --staged --quiet; then
            echo "No form telemetry changes to commit"
          else
            git commit -m "📋 Update Lead Intake & Form Health Report [$(date -u +'%Y-%m-%d %H:%M')]"
            git pull --rebase
            git push
          fi
